<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ACT Map Creator by Gemini</title>
    <style>
        :root {
            --panel-bg: #2c3e50;
            --accent: #3498db;
            --accent-hover: #2980b9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
        }

        /* Top Control Panel */
        #toolbar {
            background-color: var(--panel-bg);
            border-bottom: 2px solid #1a252f;
            display: flex;
            align-items: center;
            padding: 8px 12px;
            gap: 10px;
            z-index: 10;
            flex-wrap: wrap;
            min-height: 60px;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.2);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .tool-group label {
            font-size: 12px;
            color: #bdc3c7;
        }

        .tool-group input, .tool-group select {
            background: #34495e;
            color: #fff;
            border: 1px solid #4e6d8d;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 12px;
            width: 60px;
        }

        .tool-group input[type="color"] {
            width: 32px;
            height: 26px;
            padding: 0;
            border: none;
            cursor: pointer;
            background: none;
        }

        /* Palette Items */
        #palette {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-wrap: wrap;
        }

        .palette-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #34495e;
            border: 2px solid #4e6d8d;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            min-width: 60px;
            height: 42px;
        }

        .palette-item:hover, .palette-item:active {
            background: #3e5871;
            border-color: var(--accent);
        }

        .palette-item.active {
            border-color: #e74c3c;
            background: #4a3b3b;
        }

        .palette-item .shortcut-key {
            position: absolute;
            top: 2px;
            left: 4px;
            font-size: 9px;
            color: #95a5a6;
            background: rgba(0,0,0,0.3);
            padding: 0 2px;
            border-radius: 3px;
        }

        .palette-item .item-name {
            font-size: 10px;
            margin-top: 6px;
            font-weight: 500;
        }

        /* Action Buttons */
        .btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .btn:hover, .btn:active {
            background-color: var(--accent-hover);
        }

        .btn-success {
            background-color: #27ae60;
        }
        .btn-success:hover, .btn-success:active {
            background-color: #219653;
        }

        .btn-warning {
            background-color: #e67e22;
        }
        .btn-warning:hover {
            background-color: #d35400;
        }

        /* Main Workspace */
        #workspace {
            flex: 1;
            position: relative;
            background-color: #111;
            cursor: grab;
            overflow: hidden;
            touch-action: none;
        }

        #workspace:active {
            cursor: grabbing;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* Floating Zoom Controls (Right Upper) */
        #zoom-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 5;
        }

        .zoom-btn {
            width: 40px;
            height: 40px;
            background: rgba(44, 62, 80, 0.9);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .zoom-btn:active {
            background: rgba(52, 152, 219, 0.9);
        }

        /* Watermark on screen */
        #watermark {
            position: absolute;
            bottom: 12px;
            right: 15px;
            background: rgba(0, 0, 0, 0.6);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: #ecf0f1;
            pointer-events: none;
            z-index: 5;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Status Bar / Hints */
        #status-bar {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            pointer-events: none;
            display: flex;
            gap: 10px;
            z-index: 5;
            backdrop-filter: blur(4px);
            max-width: 85vw;
            flex-wrap: wrap;
        }

        /* Modal for Export Data */
        #modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }

        #modal-content {
            background: #2c3e50;
            width: 600px;
            max-width: 92%;
            border-radius: 8px;
            border: 1px solid #4e6d8d;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #modal-header {
            padding: 12px 16px;
            background: #1a252f;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
        }

        #modal-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #modal-body textarea {
            width: 100%;
            height: 220px;
            background: #1e272e;
            color: #dcdde1;
            border: 1px solid #4e6d8d;
            border-radius: 4px;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            resize: vertical;
        }

        #modal-footer {
            padding: 12px 16px;
            background: #1a252f;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            #toolbar {
                height: auto;
                padding: 6px;
                gap: 6px;
            }
            .tool-group {
                padding: 3px 6px;
            }
            #status-bar {
                font-size: 10px;
            }
        }
    </style>
</head>
<body>

<div id="app">
    <!-- Top Responsive Toolbar -->
    <div id="toolbar">
        <div class="tool-group">
            <label>Tile:</label>
            <input type="number" id="input-tileSize" value="40" min="10" max="200">
        </div>
        <div class="tool-group">
            <label>Cols x Rows:</label>
            <input type="number" id="input-cols" value="20" min="1" max="200">
            <input type="number" id="input-rows" value="20" min="1" max="200">
            <button class="btn" id="btn-resize">Set Size</button>
        </div>

        <div class="tool-group">
            <label>Colors:</label>
            <input type="color" id="input-bgColor" value="#dcb35c" title="Ground Color">
            <input type="color" id="input-lineColor" value="#000000" title="Grid Line Color">
        </div>

        <div class="tool-group" id="palette">
            <label>Items:</label>
            <div class="palette-item" data-type="wall" data-key="1">
                <span class="shortcut-key">[1]</span>
                <span class="item-name">Wall</span>
            </div>
            <div class="palette-item" data-type="agent" data-key="2">
                <span class="shortcut-key">[2]</span>
                <span class="item-name">Mouse</span>
            </div>
            <div class="palette-item" data-type="exit" data-key="3">
                <span class="shortcut-key">[3]</span>
                <span class="item-name">EXIT</span>
            </div>
            <div class="palette-item" data-type="cake" data-key="4">
                <span class="shortcut-key">[4]</span>
                <span class="item-name">Cake</span>
            </div>
        </div>

        <div style="margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap;">
            <button class="btn btn-warning" id="btn-fit-map" title="Fit creation inside map area">Fit Map</button>
            <button class="btn btn-success" id="btn-export-png">PNG</button>
            <button class="btn" id="btn-export-json">AI Markup</button>
        </div>
    </div>

    <!-- Workspace & Canvas -->
    <div id="workspace">
        <canvas id="mapCanvas"></canvas>

        <!-- Watermark -->
        <div id="watermark">Created By Gemini</div>

        <!-- Zoom Controls -->
        <div id="zoom-controls">
            <button class="zoom-btn" id="btn-zoom-in">+</button>
            <button class="zoom-btn" id="btn-zoom-out">-</button>
        </div>

        <!-- Status & Hints -->
        <div id="status-bar">
            <span id="coord-info">Cursor: (0, 0)</span>
            <span id="mode-info">Mode: Normal</span>
            <span>[Space]: Restick | [Esc]: Cancel | [Shift+Drag]: Box Select & Move</span>
        </div>
    </div>
</div>

<!-- Export Modal -->
<div id="modal-overlay">
    <div id="modal-content">
        <div id="modal-header">
            <span id="modal-title">AI Markup Data (JSON)</span>
            <button class="close-btn" id="modal-close">&times;</button>
        </div>
        <div id="modal-body">
            <p style="font-size: 12px; color: #bdc3c7;">Copy this structured text markup for your AI project context:</p>
            <textarea id="modal-textarea" readonly></textarea>
        </div>
        <div id="modal-footer">
            <button class="btn" id="btn-copy-modal">Copy to Clipboard</button>
        </div>
    </div>
</div>

<script>
    // --- State Management ---
    let tileSize = 40;
    let gridCols = 20;
    let gridRows = 20;
    let groundColor = '#dcb35c';
    let lineColor = '#000000';

    let scale = 1;
    let panX = 0;
    let panY = 0;

    let isInteracting = false;
    let interactionMode = 'none'; // 'pan', 'box-select', 'drag-selection'
    let startX = 0;
    let startY = 0;
    let lastTouchDistance = null;

    const mapItems = new Map(); // key: "x,y", value: {type, dir}
    let selectedTool = null;
    let lastSelectedTool = null;
    let ghostItem = null;

    // Selection box state for moving creation
    let selectionBox = null; // {startGX, startGY, endGX, endGY}
    let draggedSelectionData = null; // Map of items being moved relative to center

    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');
    const workspace = document.getElementById('workspace');
    const coordInfo = document.getElementById('coord-info');
    const modeInfo = document.getElementById('mode-info');

    let curScreenX = 0;
    let curScreenY = 0;

    function init() {
        resizeCanvasToWorkspace();
        centerMap();
        setupEventListeners();
        updateUIState();
        requestAnimationFrame(render);
    }

    function resizeCanvasToWorkspace() {
        canvas.width = workspace.clientWidth;
        canvas.height = workspace.clientHeight;
    }

    function centerMap() {
        const mapPixelWidth = gridCols * tileSize;
        const mapPixelHeight = gridRows * tileSize;
        panX = (canvas.width - mapPixelWidth * scale) / 2;
        panY = (canvas.height - mapPixelHeight * scale) / 2;
    }

    function screenToGrid(screenX, screenY) {
        const rect = canvas.getBoundingClientRect();
        const clientX = screenX - rect.left;
        const clientY = screenY - rect.top;

        const worldX = (clientX - panX) / scale;
        const worldY = (clientY - panY) / scale;

        const gx = Math.floor(worldX / tileSize);
        const gy = Math.floor(worldY / tileSize);
        return { gx, gy, inBounds: gx >= 0 && gx < gridCols && gy >= 0 && gy < gridRows };
    }

    function setupEventListeners() {
        window.addEventListener('resize', () => resizeCanvasToWorkspace());

        document.getElementById('btn-resize').addEventListener('click', () => {
            tileSize = Math.max(10, Math.min(200, parseInt(document.getElementById('input-tileSize').value) || 40));
            gridCols = Math.max(1, Math.min(200, parseInt(document.getElementById('input-cols').value) || 20));
            gridRows = Math.max(1, Math.min(200, parseInt(document.getElementById('input-rows').value) || 20));
            centerMap();
        });

        document.getElementById('input-bgColor').addEventListener('input', (e) => { groundColor = e.target.value; });
        document.getElementById('input-lineColor').addEventListener('input', (e) => { lineColor = e.target.value; });

        document.querySelectorAll('.palette-item').forEach(item => {
            item.addEventListener('click', () => selectTool(item.getAttribute('data-type')));
        });

        document.getElementById('btn-zoom-in').addEventListener('click', () => zoomAtCenter(1.2));
        document.getElementById('btn-zoom-out').addEventListener('click', () => zoomAtCenter(1 / 1.2));
        document.getElementById('btn-fit-map').addEventListener('click', fitMapToCreation);

        // --- Mouse Events ---
        canvas.addEventListener('mousedown', (e) => {
            const pos = screenToGrid(e.clientX, e.clientY);

            // Shift + click or middle click / alt click -> Box select or Pan
            if (e.shiftKey || e.button === 1 || e.button === 2 || (e.button === 0 && !ghostItem && !pos.inBounds)) {
                if (e.shiftKey && e.button === 0) {
                    // Start Box Selection
                    interactionMode = 'box-select';
                    isInteracting = true;
                    selectionBox = { startGX: Math.max(0, Math.min(gridCols-1, pos.gx)), startGY: Math.max(0, Math.min(gridRows-1, pos.gy)), endGX: Math.max(0, Math.min(gridCols-1, pos.gx)), endGY: Math.max(0, Math.min(gridRows-1, pos.gy)) };
                } else {
                    interactionMode = 'pan';
                    isInteracting = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                }
                e.preventDefault();
                return;
            }

            if (e.button === 0) {
                handleCanvasClick(e.clientX, e.clientY);
            }
        });

        window.addEventListener('mousemove', (e) => {
            curScreenX = e.clientX;
            curScreenY = e.clientY;

            if (isInteracting) {
                if (interactionMode === 'pan') {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    return;
                } else if (interactionMode === 'box-select') {
                    const pos = screenToGrid(e.clientX, e.clientY);
                    if (selectionBox) {
                        selectionBox.endGX = Math.max(0, Math.min(gridCols - 1, pos.gx));
                        selectionBox.endGY = Math.max(0, Math.min(gridRows - 1, pos.gy));
                    }
                    return;
                }
            }

            const gc = screenToGrid(e.clientX, e.clientY);
            coordInfo.innerText = gc.inBounds ? `Cursor: (${gc.gx}, ${gc.gy})` : `Cursor: Out`;
        });

        window.addEventListener('mouseup', (e) => {
            if (interactionMode === 'box-select' && selectionBox) {
                // Pick up all items in selection box and prepare for moving/relocation
                extractSelectionBox();
            }
            isInteracting = false;
            interactionMode = 'none';
        });

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            zoomAtPoint(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX, e.clientY);
        }, { passive: false });

        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // --- Touch Events for Mobile / iPad ---
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                const touch = e.touches[0];
                curScreenX = touch.clientX;
                curScreenY = touch.clientY;
                startX = touch.clientX;
                startY = touch.clientY;

                if (ghostItem) {
                    handleCanvasClick(touch.clientX, touch.clientY);
                    interactionMode = 'none';
                } else {
                    const gc = screenToGrid(touch.clientX, touch.clientY);
                    if (gc.inBounds && mapItems.has(`${gc.gx},${gc.gy}`)) {
                        handleCanvasClick(touch.clientX, touch.clientY);
                        interactionMode = 'none';
                    } else {
                        interactionMode = 'pan';
                        isInteracting = true;
                        startX = touch.clientX - panX;
                        startY = touch.clientY - panY;
                    }
                }
            } else if (e.touches.length === 2) {
                isInteracting = false;
                interactionMode = 'pinch';
                lastTouchDistance = getTouchDistance(e.touches[0], e.touches[1]);
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchmove', (e) => {
            if (e.touches.length === 1 && interactionMode === 'pan' && isInteracting) {
                const touch = e.touches[0];
                panX = touch.clientX - startX;
                panY = touch.clientY - startY;
            } else if (e.touches.length === 2 && interactionMode === 'pinch') {
                const dist = getTouchDistance(e.touches[0], e.touches[1]);
                if (lastTouchDistance) {
                    const factor = dist / lastTouchDistance;
                    const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
                    const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
                    zoomAtPoint(factor, centerX, centerY);
                }
                lastTouchDistance = dist;
            }
            if (e.touches.length > 0) {
                curScreenX = e.touches[0].clientX;
                curScreenY = e.touches[0].clientY;
                const gc = screenToGrid(curScreenX, curScreenY);
                coordInfo.innerText = gc.inBounds ? `Touch: (${gc.gx}, ${gc.gy})` : `Touch: Out`;
            }
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', () => {
            isInteracting = false;
            interactionMode = 'none';
            lastTouchDistance = null;
        });

        // --- Keyboard Shortcuts ---
        window.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === '1') selectTool('wall');
            if (e.key === '2') selectTool('agent');
            if (e.key === '3') selectTool('exit');
            if (e.key === '4') selectTool('cake');
            if (e.key === 'Escape') {
                ghostItem = null;
                selectedTool = null;
                selectionBox = null;
                draggedSelectionData = null;
                updateUIState();
            }
            if (e.key === ' ') {
                if (!ghostItem && lastSelectedTool) {
                    ghostItem = { type: lastSelectedTool, dir: 0 };
                    updateUIState();
                }
                e.preventDefault();
            }
            if (ghostItem && ghostItem.type === 'agent') {
                if (e.key === 'ArrowUp' || e.key === 'w') { ghostItem.dir = 0; e.preventDefault(); }
                if (e.key === 'ArrowRight' || e.key === 'd') { ghostItem.dir = 1; e.preventDefault(); }
                if (e.key === 'ArrowDown' || e.key === 's') { ghostItem.dir = 2; e.preventDefault(); }
                if (e.key === 'ArrowLeft' || e.key === 'a') { ghostItem.dir = 3; e.preventDefault(); }
            }
        });

        document.getElementById('btn-export-png').addEventListener('click', exportPNG);
        document.getElementById('btn-export-json').addEventListener('click', exportAIJSON);
        document.getElementById('modal-close').addEventListener('click', () => document.getElementById('modal-overlay').style.display = 'none');
        document.getElementById('btn-copy-modal').addEventListener('click', () => {
            const t = document.getElementById('modal-textarea');
            t.select();
            document.execCommand('copy');
        });
    }

    function handleCanvasClick(screenX, screenY) {
        const gc = screenToGrid(screenX, screenY);
        if (!gc.inBounds) return;
        const key = `${gc.gx},${gc.gy}`;

        if (draggedSelectionData) {
            // Place dragged multi-selection group relative to clicked anchor
            const minX = Math.min(...draggedSelectionData.map(i => i.x));
            const minY = Math.min(...draggedSelectionData.map(i => i.y));
            draggedSelectionData.forEach(item => {
                const targetX = gc.gx + (item.x - minX);
                const targetY = gc.gy + (item.y - minY);
                if (targetX >= 0 && targetX < gridCols && targetY >= 0 && targetY < gridRows) {
                    mapItems.set(`${targetX},${targetY}`, { type: item.type, dir: item.dir });
                }
            });
            draggedSelectionData = null;
            selectionBox = null;
            updateUIState();
            return;
        }

        if (ghostItem) {
            mapItems.set(key, { type: ghostItem.type, dir: ghostItem.dir });
        } else {
            if (mapItems.has(key)) {
                const existing = mapItems.get(key);
                if (existing.type === 'agent') {
                    existing.dir = (existing.dir + 1) % 4;
                } else {
                    ghostItem = { ...existing };
                    lastSelectedTool = existing.type;
                    mapItems.delete(key);
                    updateUIState();
                }
            }
        }
    }

    function extractSelectionBox() {
        if (!selectionBox) return;
        const minX = Math.min(selectionBox.startGX, selectionBox.endGX);
        const maxX = Math.max(selectionBox.startGX, selectionBox.endGX);
        const minY = Math.min(selectionBox.startGY, selectionBox.endGY);
        const maxY = Math.max(selectionBox.startGY, selectionBox.endGY);

        draggedSelectionData = [];
        mapItems.forEach((item, key) => {
            const [x, y] = key.split(',').map(Number);
            if (x >= minX && x <= maxX && y >= minY && y <= maxY) {
                draggedSelectionData.push({ x, y, type: item.type, dir: item.dir });
                mapItems.delete(key);
            }
        });
        modeInfo.innerText = `Mode: Moving Selection (${draggedSelectionData.length} items). Click destination to place.`;
    }

    function fitMapToCreation() {
        if (mapItems.size === 0) return;
        let minX = gridCols, maxX = 0, minY = gridRows, maxY = 0;
        mapItems.forEach((_, key) => {
            const [x, y] = key.split(',').map(Number);
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
        });
        const neededCols = maxX - minX + 3;
        const neededRows = maxY - minY + 3;
        document.getElementById('input-cols').value = Math.min(200, Math.max(1, neededCols));
        document.getElementById('input-rows').value = Math.min(200, Math.max(1, neededRows));
        gridCols = parseInt(document.getElementById('input-cols').value);
        gridRows = parseInt(document.getElementById('input-rows').value);
        centerMap();
    }

    function getTouchDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.sqrt(dx * dx + dy * dy);
    }

    function selectTool(type) {
        selectedTool = type;
        lastSelectedTool = type;
        ghostItem = { type: type, dir: 0 };
        draggedSelectionData = null;
        selectionBox = null;
        updateUIState();
    }

    function updateUIState() {
        document.querySelectorAll('.palette-item').forEach(item => {
            item.classList.toggle('active', item.getAttribute('data-type') === selectedTool && ghostItem);
        });
        if (draggedSelectionData) {
            modeInfo.innerText = `Mode: Place Selected Group`;
        } else {
            modeInfo.innerText = `Mode: ${ghostItem ? 'Placing: ' + ghostItem.type.toUpperCase() : 'Normal'}`;
        }
    }

    function zoomAtCenter(f) { zoomAtPoint(f, canvas.width / 2, canvas.height / 2); }

    function zoomAtPoint(factor, cX, cY) {
        const newScale = Math.max(0.15, Math.min(5.0, scale * factor));
        const rect = canvas.getBoundingClientRect();
        const x = cX - rect.left;
        const y = cY - rect.top;
        panX = x - (x - panX) * (newScale / scale);
        panY = y - (y - panY) * (newScale / scale);
        scale = newScale;
    }

    function drawItem(context, gx, gy, type, dir, isGhost = false) {
        const x = gx * tileSize;
        const y = gy * tileSize;
        context.save();
        context.globalAlpha = isGhost ? 0.6 : 1.0;

        if (type === 'wall') {
            context.fillStyle = '#8B4513';
            context.fillRect(x, y, tileSize, tileSize);
            context.fillStyle = '#5C2D0C';
            const t = Math.max(2, tileSize * 0.12);
            context.fillRect(x + t, y + t, tileSize - (t * 2), tileSize - (t * 2));
        } else if (type === 'agent') {
            // White Mouse Agent
            context.save();
            context.translate(x + tileSize / 2, y + tileSize / 2);
            context.rotate((dir * 90) * Math.PI / 180);
            // Mouse body
            context.fillStyle = '#ecf0f1';
            context.beginPath();
            context.ellipse(0, 0, tileSize * 0.32, tileSize * 0.4, 0, 0, Math.PI * 2);
            context.fill();
            context.strokeStyle = '#bdc3c7';
            context.lineWidth = 1.5;
            context.stroke();
            // Direction Arrow / Head indicator
            context.fillStyle = '#e74c3c';
            context.beginPath();
            context.moveTo(0, -tileSize * 0.5);
            context.lineTo(tileSize * 0.22, -tileSize * 0.25);
            context.lineTo(-tileSize * 0.22, -tileSize * 0.25);
            context.closePath();
            context.fill();
            context.restore();
        } else if (type === 'exit') {
            context.fillStyle = '#f1c40f';
            context.fillRect(x + tileSize * 0.08, y + tileSize * 0.08, tileSize * 0.84, tileSize * 0.84);
            context.strokeStyle = '#d35400';
            context.lineWidth = 2;
            context.strokeRect(x + tileSize * 0.08, y + tileSize * 0.08, tileSize * 0.84, tileSize * 0.84);
            context.fillStyle = '#000';
            context.font = `bold ${Math.max(8, tileSize * 0.28)}px sans-serif`;
            context.textAlign = 'center';
            context.textBaseline = 'middle';
            context.fillText('EXIT', x + tileSize / 2, y + tileSize / 2);
        } else if (type === 'cake') {
            // Slice of cake award
            context.fillStyle = '#e67e22';
            context.beginPath();
            context.moveTo(x + tileSize * 0.5, y + tileSize * 0.15);
            context.lineTo(x + tileSize * 0.85, y + tileSize * 0.85);
            context.lineTo(x + tileSize * 0.15, y + tileSize * 0.85);
            context.closePath();
            context.fill();
            // Frosting / Cherry top
            context.fillStyle = '#ff7675';
            context.beginPath();
            context.arc(x + tileSize * 0.5, y + tileSize * 0.25, tileSize * 0.12, 0, Math.PI * 2);
            context.fill();
        }
        context.restore();
    }

    function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(panX, panY);
        ctx.scale(scale, scale);

        // Ground color background
        ctx.fillStyle = groundColor;
        ctx.fillRect(0, 0, gridCols * tileSize, gridRows * tileSize);

        // Grid lines
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 1 / scale;
        ctx.beginPath();
        for (let x = 0; x <= gridCols; x++) { ctx.moveTo(x * tileSize, 0); ctx.lineTo(x * tileSize, gridRows * tileSize); }
        for (let y = 0; y <= gridRows; y++) { ctx.moveTo(0, y * tileSize); ctx.lineTo(gridCols * tileSize, y * tileSize); }
        ctx.stroke();

        // Placed items
        mapItems.forEach((item, key) => {
            const [gx, gy] = key.split(',').map(Number);
            drawItem(ctx, gx, gy, item.type, item.dir, false);
        });

        // Selection box visualization
        if (selectionBox) {
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 2 / scale;
            ctx.fillStyle = 'rgba(52, 152, 219, 0.2)';
            const minX = Math.min(selectionBox.startGX, selectionBox.endGX) * tileSize;
            const minY = Math.min(selectionBox.startGY, selectionBox.endGY) * tileSize;
            const w = (Math.abs(selectionBox.endGX - selectionBox.startGX) + 1) * tileSize;
            const h = (Math.abs(selectionBox.endGY - selectionBox.startGY) + 1) * tileSize;
            ctx.fillRect(minX, minY, w, h);
            ctx.strokeRect(minX, minY, w, h);
        }

        // Ghost item on cursor/touch
        if (ghostItem) {
            const gc = screenToGrid(curScreenX, curScreenY);
            if (gc.inBounds) {
                drawItem(ctx, gc.gx, gc.gy, ghostItem.type, ghostItem.dir, true);
            }
        }

        ctx.restore();
        requestAnimationFrame(render);
    }

    function exportPNG() {
        const ec = document.createElement('canvas');
        ec.width = gridCols * tileSize;
        ec.height = gridRows * tileSize;
        const ectx = ec.getContext('2d');
        ectx.fillStyle = groundColor;
        ectx.fillRect(0, 0, ec.width, ec.height);

        ectx.strokeStyle = lineColor;
        ectx.lineWidth = 1;
        ectx.beginPath();
        for (let x = 0; x <= gridCols; x++) { ectx.moveTo(x * tileSize, 0); ectx.lineTo(x * tileSize, ec.height); }
        for (let y = 0; y <= gridRows; y++) { ectx.moveTo(0, y * tileSize); ectx.lineTo(ec.width, y * tileSize); }
        ectx.stroke();

        mapItems.forEach((item, key) => {
            const [gx, gy] = key.split(',').map(Number);
            drawItem(ectx, gx, gy, item.type, item.dir, false);
        });

        const a = document.createElement('a');
        a.download = 'act_map.png';
        a.href = ec.toDataURL('image/png');
        a.click();
    }

    function exportAIJSON() {
        const data = {
            creator: "Gemini",
            gridSize: { cols: gridCols, rows: gridRows, tileSize: tileSize },
            items: []
        };
        mapItems.forEach((item, key) => {
            const [x, y] = key.split(',').map(Number);
            const entry = { x, y, type: item.type };
            if (item.type === 'agent') {
                entry.direction = ['North', 'East', 'South', 'West'][item.dir];
                entry.rotationIndex = item.dir;
            }
            data.items.push(entry);
        });
        document.getElementById('modal-textarea').value = JSON.stringify(data, null, 2);
        document.getElementById('modal-overlay').style.display = 'flex';
    }

    init();
</script>
</body>
</html>
