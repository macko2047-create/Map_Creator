<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>ACT Mouse Runner by Grok</title>
  <style>
    :root {
      --sand: #E6C98A;
      --grid: #000000;
      --wall: #8B4513;
      --bg: #161616;
      --panel: #242424;
      --border: #3d3d3d;
      --text: #f0f0f0;
      --muted: #9a9a9a;
      --accent: #3dd68c;
      --danger: #e85d5d;
      --exit: #FFD400;
      --path: #1B5E20;
      --plan: #1565C0;
      --search: #7E57C2;
      --btn: 44px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
      position: relative;
    }
    .bar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }
    button.btn, .file-btn {
      flex: 0 0 auto;
      min-height: var(--btn);
      min-width: var(--btn);
      padding: 0 14px;
      border: 1px solid #555;
      border-radius: 8px;
      background: #333;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    button.btn:disabled { opacity: 0.45; cursor: default; }
    button.btn.primary { border-color: #2e7d32; background: #1e3d20; }
    button.btn.danger { border-color: #7a3030; background: #3a1c1c; }
    button.btn.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    label.field, label.check {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: var(--muted);
      white-space: nowrap;
      flex: 0 0 auto;
    }
    label.field select {
      height: 36px;
      min-height: 36px;
      padding: 0 8px;
      border: 1px solid #555;
      border-radius: 6px;
      background: #1b1b1b;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }
    #stage {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
      background: #0e0e0e;
      display: flex;
      flex-direction: row;
    }
    .pane {
      flex: 1 1 50%;
      min-width: 0;
      min-height: 0;
      display: flex;
      flex-direction: column;
      position: relative;
      border-right: 1px solid var(--border);
    }
    .pane:last-child { border-right: none; }
    .pane-label {
      flex: 0 0 auto;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      background: #1c1c1c;
      border-bottom: 1px solid var(--border);
      color: #ddd;
    }
    .pane-label span { color: var(--muted); font-weight: 500; margin-left: 8px; }
    .pane-canvas {
      flex: 1 1 auto;
      min-height: 0;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #zoom {
      position: absolute;
      top: 8px;
      right: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 3;
    }
    @media (max-width: 720px) {
      #stage { flex-direction: column; }
      .pane { border-right: none; border-bottom: 1px solid var(--border); flex-basis: 50%; }
      .pane:last-child { border-bottom: none; }
    }
    #legend {
      position: absolute;
      left: 8px;
      bottom: 8px;
      background: #111c;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 11px;
      color: #ddd;
      line-height: 1.5;
      pointer-events: none;
    }
    .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
    #log {
      flex: 0 0 auto;
      max-height: 28vh;
      overflow: auto;
      background: #1a1a1a;
      border-top: 1px solid var(--border);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12px;
      line-height: 1.45;
      padding: 8px 10px;
      color: #cde;
      -webkit-user-select: text;
      user-select: text;
      white-space: pre-wrap;
    }
    #footer {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 8px;
      background: var(--panel);
      border-top: 1px solid var(--border);
      font-size: 12px;
    }
    #status { flex: 1 1 auto; color: var(--muted); min-width: 0; }
    #credit { color: #888; white-space: nowrap; }
    .hint { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #map-name {
      flex: 0 0 auto;
      max-width: 220px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    #drop-mask {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 20;
      background: rgba(29, 80, 52, 0.55);
      border: 3px dashed var(--accent);
      color: #fff;
      font-size: 22px;
      font-weight: 800;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    #app.dragover #drop-mask { display: flex; }
  </style>
</head>
<body>
  <div id="app">
    <div class="bar">
      <button type="button" class="btn primary" id="btn-run">執行</button>
      <button type="button" class="btn" id="btn-pause">暫停</button>
      <button type="button" class="btn" id="btn-step">下一步</button>
      <button type="button" class="btn danger" id="btn-reset">重設</button>
      <label class="field">速度 <input id="inp-speed" type="range" min="60" max="700" value="280"></label>
      <button type="button" class="btn" id="btn-fit">Fit Screen</button>
      <button type="button" class="btn primary" id="btn-load">載入 JSON 地圖</button>
      <span id="map-name">預設：GPT-5.6 Sol</span>
      <label class="field">視力
        <select id="sel-vision" title="老鼠視力距離">
          <option value="1">1 格</option>
          <option value="2" selected>2 格</option>
          <option value="3">3 格</option>
          <option value="4">4 格</option>
          <option value="5">5 格</option>
          <option value="6">6 格</option>
          <option value="7">7 格</option>
          <option value="8">8 格</option>
        </select>
      </label>
      <label class="check"><input id="chk-search" type="checkbox" checked> 顯示視力範圍</label>
      <label class="check"><input id="chk-nums" type="checkbox" checked> 顯示步數</label>
      <span class="hint" id="hint-ai">可斜行，斜行同直行一步等權。牆角四邊任一有牆都唔過。大房見牆唔行埋。</span>
    </div>
    <div id="stage">
      <div class="pane" id="pane-mouse">
        <div class="pane-label">老鼠視野 <span id="label-mouse">2 格視力 · 360° 視線</span></div>
        <div class="pane-canvas"><canvas id="map"></canvas></div>
        <div id="legend">
          <div><span class="sw" style="background:#1a1a1a;border:1px solid #555"></span>迷霧（未見過）</div>
          <div><span class="sw" style="background:#8a7848"></span>記憶（見過）</div>
          <div><span class="sw" style="background:#F4E3A8"></span>而家睇到</div>
          <div><span class="sw" style="background:#fff;border:1px solid #888"></span>開發者：視力白框</div>
          <div><span class="sw" style="background:#1B5E20"></span>行過的路</div>
        </div>
      </div>
      <div class="pane" id="pane-dev">
        <div class="pane-label">開發者全圖 <span>無迷霧 · 白框＝視力</span></div>
        <div class="pane-canvas"><canvas id="map-dev"></canvas></div>
      </div>
      <div id="zoom">
        <button type="button" class="btn" id="btn-zoom-in">+</button>
        <button type="button" class="btn" id="btn-zoom-out">−</button>
      </div>
    </div>
    <div id="log">尚未執行。可改視力 1–8 格。老鼠可斜行（同直行一步等權）。唔知地圖設計。按「執行」睇佢點樣探索 EXIT。</div>
    <div id="footer">
      <span id="status">Ready</span>
      <span id="credit">Created By Grok</span>
    </div>
    <div id="drop-mask">放下 ACT_MAP_CREATOR JSON</div>
  </div>
  <input id="file-json" type="file" accept=".json,application/json" hidden>

    }

    }

          if (!(x >= 0 && x <= cols && y >= 0 && y < rws)) return { error: "牆超出地圖" };
          if (wV[key(x, y)]) return { error: "重複的牆" };
          wV[key(x, y)] = true;
        }
        items.push({ type: "wall", x: x, y: y, orientation: ori });
      } else if (t === "mouse" || t === "exit" || t === "cake") {
        if (!(x >= 0 && y >= 0 && x < cols && y < rws)) return { error: "物件超出地圖" };
        if (tiles[key(x, y)]) return { error: "同一格有兩個物件" };
        tiles[key(x, y)] = true;
        if (t === "mouse") {
          dir = it.direction;
          if (DIRS.indexOf(dir) < 0) return { error: "老鼠方向無效" };
          items.push({ type: "mouse", x: x, y: y, direction: dir });
        } else {
          items.push({ type: t, x: x, y: y });
        }
      } else {
        return { error: "未知物件類型" };
      }
    }
    return { columns: cols, rows: rws, tileSize: ts, items: items };
  }

  function applyParsed(parsed, label) {
    columns = parsed.columns;
    rows = parsed.rows;
    tileSize = parsed.tileSize;
    originalItems = parsed.items.map(function (it) { return JSON.parse(JSON.stringify(it)); });
    resetLive(false);
    fitScreen();
    setStatus(label || "地圖已載入");
    draw();
  }

  function loadMapText(text, name) {
    var data, parsed;
    try { data = JSON.parse(text); }
    catch (err) {
      setStatus("JSON 讀取失敗");
      return false;
    }
    parsed = parseMap(data);
    if (parsed.error) {
      setStatus(parsed.error);
      return false;
    }
    if (mapNameEl) mapNameEl.textContent = name || "已載入地圖";
    applyParsed(parsed, "已載入地圖：" + (name || "JSON"));
    return true;
  }

  function loadMapFile(file) {
    if (!file) return;
    var name = file.name || "map.json";
    if (!/\.json$/i.test(name) && file.type && file.type.indexOf("json") < 0) {
      setStatus("請選擇 ACT_MAP_CREATOR JSON 檔");
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      loadMapText(String(reader.result || ""), name);
    };
    reader.onerror = function () { setStatus("JSON 讀取失敗"); };
    reader.readAsText(file);
  }

  function rebuildWorld() {
    world = { wallH: {}, wallV: {}, mouse: null, exit: null, cakes: {} };
    originalItems.forEach(function (it) {
      if (it.type === "wall") {
        if (it.orientation === "H") world.wallH[key(it.x, it.y)] = true;
        else world.wallV[key(it.x, it.y)] = true;
      } else if (it.type === "mouse" && !world.mouse) world.mouse = it;
      else if (it.type === "exit" && !world.exit) world.exit = it;
      else if (it.type === "cake") world.cakes[key(it.x, it.y)] = { x: it.x, y: it.y };
    });
  }

  function emptyMemory() {
    return {
      seen: {},
      visible: {},
      edge: {},
      exit: null,
      cakes: {},
      visited: {}
    };
  }

  function resetLive(announce) {
    stopTimer();
    rebuildWorld();
    liveMouse = world.mouse ? { x: world.mouse.x, y: world.mouse.y, direction: world.mouse.direction } : null;
    eaten = {};
    memory = emptyMemory();
    roomCache = {};
    clearanceCache = {};
    trail = [];
    logLines = [];
    lastWhy = "";
    mode = "idle";
    if (liveMouse) {
      trail.push({ x: liveMouse.x, y: liveMouse.y, dir: liveMouse.direction, why: "起點" });
      sense();
      memory.visited[key(liveMouse.x, liveMouse.y)] = true;
    }
    writeLog();
    updateButtons();
    if (announce) setStatus("已重設");
    else if (liveMouse) setStatus("老鼠視力 " + VISION + " 格，未見過地圖其餘部分");
    draw();
  }

  function trueOrthoBlocked(x, y, nx, ny) {
    if (nx < 0 || ny < 0 || nx >= columns || ny >= rows) return true;
    if (nx === x && ny === y - 1) return !!world.wallH[key(x, y)];
    if (nx === x && ny === y + 1) return !!world.wallH[key(x, y + 1)];
    if (ny === y && nx === x - 1) return !!world.wallV[key(x, y)];
    if (ny === y && nx === x + 1) return !!world.wallV[key(x + 1, y)];
    return true;
  }

  function diagLegs(x, y, nx, ny) {
    var dx = nx - x, dy = ny - y;
    return [
      [x, y, x + dx, y],
      [x, y, x, y + dy],
      [x + dx, y, nx, ny],
      [x, y + dy, nx, ny]
    ];
  }

  function trueBlocked(x, y, nx, ny) {
    if (nx < 0 || ny < 0 || nx >= columns || ny >= rows) return true;
    var dx = nx - x, dy = ny - y, legs, i;
    if (Math.abs(dx) + Math.abs(dy) === 1) return trueOrthoBlocked(x, y, nx, ny);
    if (Math.abs(dx) === 1 && Math.abs(dy) === 1) {
      legs = diagLegs(x, y, nx, ny);
      for (i = 0; i < legs.length; i++) {
        if (trueOrthoBlocked(legs[i][0], legs[i][1], legs[i][2], legs[i][3])) return true;
      }
      return false;
    }
    return true;
  }

  function moveEdge(x, y, nx, ny) {
    if (nx === x && ny === y - 1) return edgeKey("H", x, y);
    if (nx === x && ny === y + 1) return edgeKey("H", x, y + 1);
    if (ny === y && nx === x - 1) return edgeKey("V", x, y);
    if (ny === y && nx === x + 1) return edgeKey("V", x + 1, y);
    return null;
  }

  function worldObjectAt(x, y) {
    var k = key(x, y);
    if (world.exit && world.exit.x === x && world.exit.y === y) return "exit";
    if (world.cakes[k] && !eaten[k]) return "cake";
    return null;
  }

  function hasLineOfSight(x0, y0, x1, y1) {
    if (x0 === x1 && y0 === y1) return true;
    var x = x0, y = y0;
    var dx = x1 - x0, dy = y1 - y0;
    var sx = dx === 0 ? 0 : (dx > 0 ? 1 : -1);
    var sy = dy === 0 ? 0 : (dy > 0 ? 1 : -1);
    var adx = Math.abs(dx), ady = Math.abs(dy);
    var tx = adx ? 0.5 / adx : Infinity;
    var ty = ady ? 0.5 / ady : Infinity;
    var dtx = adx ? 1 / adx : Infinity;
    var dty = ady ? 1 / ady : Infinity;
    var eps = 1e-9;
    while (x !== x1 || y !== y1) {
      if (tx + eps < ty) {
        if (trueBlocked(x, y, x + sx, y)) return false;
        x += sx;
        tx += dtx;
      } else if (ty + eps < tx) {
        if (trueBlocked(x, y, x, y + sy)) return false;
        y += sy;
        ty += dty;
      } else {
        if (trueBlocked(x, y, x + sx, y + sy)) return false;
        x += sx;
        y += sy;
        tx += dtx;
        ty += dty;
      }
    }
    return true;
  }

  // 感應器：唯一可以讀真實地圖嘅地方。AI 只會收到 memory。
  // 360° 視力 = Chebyshev 距離 + 直線視線；牆會擋住，唔可以轉彎偷看。
  function sense() {
    if (!liveMouse || !memory) return;
    var mx = liveMouse.x, my = liveMouse.y;
    memory.visible = {};
    var x, y, d, i, nx, ny, nk, dir, obj;
    for (y = my - VISION; y <= my + VISION; y++) {
      for (x = mx - VISION; x <= mx + VISION; x++) {
        if (x < 0 || y < 0 || x >= columns || y >= rows) continue;
        d = Math.max(Math.abs(x - mx), Math.abs(y - my));
        if (d > VISION) continue;
        if (!hasLineOfSight(mx, my, x, y)) continue;
        memory.visible[key(x, y)] = true;
        memory.seen[key(x, y)] = true;
        obj = worldObjectAt(x, y);
        if (obj === "exit") memory.exit = { x: x, y: y };
        if (obj === "cake") memory.cakes[key(x, y)] = { x: x, y: y };
      }
    }
    Object.keys(memory.visible).forEach(function (tk) {
      var parts = tk.split(",");
      x = Number(parts[0]);
      y = Number(parts[1]);
      for (i = 0; i < CARDINALS.length; i++) {
        dir = CARDINALS[i];
        nx = x + DIR_VEC[dir][0];
        ny = y + DIR_VEC[dir][1];
        nk = moveEdge(x, y, nx, ny);
        if (!nk) continue;
        memory.edge[nk] = trueBlocked(x, y, nx, ny) ? "wall" : "open";
      }
    });
    Object.keys(memory.cakes).forEach(function (ck) {
      if (eaten[ck]) delete memory.cakes[ck];
    });
    roomCache = {};
    clearanceCache = {};
  }

  function memOrthoBlocked(x, y, nx, ny) {
    if (nx < 0 || ny < 0 || nx >= columns || ny >= rows) return true;
    var ek = moveEdge(x, y, nx, ny);
    if (!ek || memory.edge[ek] == null) return null;
    return memory.edge[ek] === "wall";
  }

  function memBlocked(x, y, nx, ny) {
    if (nx < 0 || ny < 0 || nx >= columns || ny >= rows) return true;
    var dx = nx - x, dy = ny - y, legs, i, r, unknown;
    if (Math.abs(dx) === 1 && Math.abs(dy) === 1) {
      legs = diagLegs(x, y, nx, ny);
      unknown = false;
      for (i = 0; i < legs.length; i++) {
        r = memOrthoBlocked(legs[i][0], legs[i][1], legs[i][2], legs[i][3]);
        if (r === true) return true;
        if (r == null) unknown = true;
      }
      return unknown ? null : false;
    }
    return memOrthoBlocked(x, y, nx, ny);
  }

  function knownNeighbors(x, y) {
    var out = [], i, dir, nx, ny, b;
    for (i = 0; i < DIRS.length; i++) {
      dir = DIRS[i];
      nx = x + DIR_VEC[dir][0];
      ny = y + DIR_VEC[dir][1];
      b = memBlocked(x, y, nx, ny);
      if (b === false) out.push({ x: nx, y: ny, dir: dir });
    }
    return out;
  }

  function isSeenTile(x, y) {
    return x >= 0 && y >= 0 && x < columns && y < rows && !!memory.seen[key(x, y)];
  }

  function tileTouchesKnownWall(x, y) {
    var i, dir, nx, ny;
    for (i = 0; i < CARDINALS.length; i++) {
      dir = CARDINALS[i];
      nx = x + DIR_VEC[dir][0];
      ny = y + DIR_VEC[dir][1];
      if (memBlocked(x, y, nx, ny) === true) return true;
    }
    return false;
  }

  function isOpen3x3(ox, oy) {
    var i, j, a, b;
    if (ox < 0 || oy < 0 || ox + 2 >= columns || oy + 2 >= rows) return false;
    for (j = 0; j < 3; j++) {
      for (i = 0; i < 3; i++) {
        if (!isSeenTile(ox + i, oy + j)) return false;
      }
    }
    for (j = 0; j < 3; j++) {
      for (i = 0; i < 2; i++) {
        a = ox + i; b = oy + j;
        if (memBlocked(a, b, a + 1, b) !== false) return false;
      }
    }
    for (j = 0; j < 2; j++) {
      for (i = 0; i < 3; i++) {
        a = ox + i; b = oy + j;
        if (memBlocked(a, b, a, b + 1) !== false) return false;
      }
    }
    return true;
  }

  function inRoom(x, y) {
    var k = key(x, y);
    if (roomCache[k] != null) return roomCache[k];
    var ox, oy, found = false;
    for (oy = y - 2; oy <= y; oy++) {
      for (ox = x - 2; ox <= x; ox++) {
        if (isOpen3x3(ox, oy)) {
          found = true;
          break;
        }
      }
      if (found) break;
    }
    roomCache[k] = found;
    return found;
  }

  function wallClearance(x, y) {
    var k = key(x, y);
    if (clearanceCache[k] != null) return clearanceCache[k];
    if (tileTouchesKnownWall(x, y)) {
      clearanceCache[k] = 0;
      return 0;
    }
    var min = 99, keys = Object.keys(memory.seen), i, parts, sx, sy, d;
    for (i = 0; i < keys.length; i++) {
      parts = keys[i].split(",");
      sx = Number(parts[0]);
      sy = Number(parts[1]);
      if (!tileTouchesKnownWall(sx, sy)) continue;
      d = Math.abs(sx - x) + Math.abs(sy - y);
      if (d < min) min = d;
    }
    clearanceCache[k] = min;
    return min;
  }

  function hasUnseenSideOpening(x, y, moveDir) {
    var i, dir, nx, ny, b;
    for (i = 0; i < DIRS.length; i++) {
      dir = DIRS[i];
      if (dir === moveDir || dir === DIR_REV[moveDir]) continue;
      nx = x + DIR_VEC[dir][0];
      ny = y + DIR_VEC[dir][1];
      b = memBlocked(x, y, nx, ny);
      if (b === true) continue;
      if (b == null) return true;
      if (!memory.seen[key(nx, ny)]) return true;
    }
    return false;
  }

  function lookingAtBareWall(x, y, dir) {
    if (!inRoom(x, y)) return false;
    var v = DIR_VEC[dir];
    var cx = x, cy = y, step, nx, ny, b, nk;
    for (step = 1; step <= VISION; step++) {
      nx = cx + v[0];
      ny = cy + v[1];
      b = memBlocked(cx, cy, nx, ny);
      if (b === true) return true;
      if (b == null) return false;
      nk = key(nx, ny);
      if (!memory.seen[nk]) return false;
      if (memory.exit && memory.exit.x === nx && memory.exit.y === ny) return false;
      if (memory.cakes[nk]) return false;
      if (hasUnseenSideOpening(nx, ny, dir)) return false;
      cx = nx;
      cy = ny;
    }
    nx = cx + v[0];
    ny = cy + v[1];
    return memBlocked(cx, cy, nx, ny) === true;
  }

  function isUsefulTile(x, y) {
    if (memory.exit && memory.exit.x === x && memory.exit.y === y) return true;
    return !!memory.cakes[key(x, y)];
  }

  function isWastefulWallApproach(x, y, n) {
    if (isUsefulTile(n.x, n.y)) return false;
    if (!inRoom(x, y) && !inRoom(n.x, n.y)) return false;
    return lookingAtBareWall(x, y, n.dir);
  }

  function stepEnterCost(fromX, fromY, toX, toY, dir) {
    var cost = 1;
    if (!inRoom(fromX, fromY) && !inRoom(toX, toY)) return cost;
    if (isUsefulTile(toX, toY)) return cost;
    if (lookingAtBareWall(fromX, fromY, dir)) cost += 25;
    var cl = wallClearance(toX, toY);
    if (cl < VISION) cost += (VISION - cl) * 3;
    if (cl === 0) cost += 7;
    return cost;
  }

  function bfsKnown(sx, sy, goalFn) {
    var dist = {};
    var prev = {};
    var pdir = {};
    var sk = key(sx, sy);
    dist[sk] = 0;
    var q = [{ x: sx, y: sy }];
    var qi = 0, cur, i, n, nbs, nk, nd, ck;
    while (qi < q.length) {
      cur = q[qi++];
      ck = key(cur.x, cur.y);
      nbs = knownNeighbors(cur.x, cur.y);
      for (i = 0; i < nbs.length; i++) {
        n = nbs[i];
        nk = key(n.x, n.y);
        nd = dist[ck] + stepEnterCost(cur.x, cur.y, n.x, n.y, n.dir);
        if (dist[nk] == null || nd < dist[nk]) {
          dist[nk] = nd;
          prev[nk] = { x: cur.x, y: cur.y };
          pdir[nk] = n.dir;
          q.push({ x: n.x, y: n.y });
        }
      }
    }
    var best = null, bestD = Infinity, k, parts, x, y;
    Object.keys(dist).forEach(function (k2) {
      parts = k2.split(",");
      x = Number(parts[0]);
      y = Number(parts[1]);
      if (goalFn(x, y) && dist[k2] < bestD) {
        bestD = dist[k2];
        best = { x: x, y: y };
        k = k2;
      }
    });
    if (!best) return null;
    var path = [], cx = best.x, cy = best.y, n2;
    while (true) {
      ck = key(cx, cy);
      path.push({ x: cx, y: cy, dir: pdir[ck] || liveMouse.direction });
      if (cx === sx && cy === sy) break;
      n2 = prev[ck];
      cx = n2.x;
      cy = n2.y;
    }
    path.reverse();
    path.cost = bestD;
    return path;
  }

  function isVisibleDeadEnd(fromX, fromY, toX, toY) {
    var tk = key(toX, toY);
    if (!memory.visible[tk]) return false;
    var q = [{ x: toX, y: toY }];
    var seen = {};
    seen[key(fromX, fromY)] = true;
    seen[tk] = true;
    var head = 0, cur, i, dir, nx, ny, b, nk;
    while (head < q.length) {
      cur = q[head++];
      if (memory.exit && memory.exit.x === cur.x && memory.exit.y === cur.y) return false;
      if (memory.cakes[key(cur.x, cur.y)]) return false;
      for (i = 0; i < DIRS.length; i++) {
        dir = DIRS[i];
        nx = cur.x + DIR_VEC[dir][0];
        ny = cur.y + DIR_VEC[dir][1];
        b = memBlocked(cur.x, cur.y, nx, ny);
        if (b == null) return false;
        if (b === true) continue;
        nk = key(nx, ny);
        if (seen[nk]) continue;
        if (!memory.seen[nk] || !memory.visible[nk]) return false;
        seen[nk] = true;
        q.push({ x: nx, y: ny });
      }
    }
    return true;
  }

  function frontierTiles() {
    var out = [], seenKeys = Object.keys(memory.seen), i, j, parts, x, y, nbs, n, dir, nx, ny, b;
    for (i = 0; i < seenKeys.length; i++) {
      parts = seenKeys[i].split(",");
      x = Number(parts[0]); y = Number(parts[1]);
      nbs = knownNeighbors(x, y);
      for (j = 0; j < nbs.length; j++) {
        n = nbs[j];
        if (!memory.seen[key(n.x, n.y)]) {
          out.push({ x: x, y: y });
          nbs = null;
          break;
        }
      }
      if (!nbs) continue;
      for (j = 0; j < CARDINALS.length; j++) {
        dir = CARDINALS[j];
        nx = x + DIR_VEC[dir][0];
        ny = y + DIR_VEC[dir][1];
        b = memBlocked(x, y, nx, ny);
        if (b == null && nx >= 0 && ny >= 0 && nx < columns && ny < rows) {
          out.push({ x: x, y: y });
          break;
        }
      }
    }
    return out;
  }

  function stepScore(firstDir, facing, pathCost, targetVisited, fromX, fromY, toX, toY) {
    var reverse = firstDir === DIR_REV[facing] ? 1 : 0;
    var forward = firstDir === facing ? 0 : 1;
    var vis = targetVisited ? 1 : 0;
    var hug = 0;
    if (inRoom(fromX, fromY) || inRoom(toX, toY)) {
      hug = (VISION - Math.min(VISION, wallClearance(toX, toY))) * 8;
      if (lookingAtBareWall(fromX, fromY, firstDir)) hug += 40;
    }
    return pathCost * 100 + reverse * 20 + forward * 5 + vis + hug;
  }

  function unseenStepFrom(x, y, facing) {
    var nbs = knownNeighbors(x, y);
    var i, n, best = null, sc, bsc;
    for (i = 0; i < nbs.length; i++) {
      n = nbs[i];
      if (memory.seen[key(n.x, n.y)]) continue;
      if (isVisibleDeadEnd(x, y, n.x, n.y)) continue;
      if (isWastefulWallApproach(x, y, n)) continue;
      sc = stepScore(n.dir, facing, 1, false, x, y, n.x, n.y);
      if (!best || sc < bsc) { best = n; bsc = sc; }
    }
    return best;
  }

  // AI 只讀 memory／老鼠自己位置，唔讀 world 牆壁同隱藏物件。
  function decide() {
    roomCache = {};
    clearanceCache = {};
    var mx = liveMouse.x, my = liveMouse.y, facing = liveMouse.direction;
    var path, nbs, i, n, fs, targets, t, best, sc, local, first, roomy, why;
    roomy = inRoom(mx, my);
    if (memory.exit) {
      path = bfsKnown(mx, my, function (x, y) { return x === memory.exit.x && y === memory.exit.y; });
      if (path && path.length === 1) return { done: "exit", why: "已到達 EXIT" };
      if (path && path.length > 1) {
        first = path[1];
        return { x: first.x, y: first.y, dir: first.dir, why: "見到 EXIT，向出口行" };
      }
    }
    if (Object.keys(memory.cakes).length) {
      path = bfsKnown(mx, my, function (x, y) { return !!memory.cakes[key(x, y)]; });
      if (path && path.length === 1) return { eat: true, why: "食蛋糕" };
      if (path && path.length > 1) {
        first = path[1];
        return { x: first.x, y: first.y, dir: first.dir, why: "見到蛋糕（bonus），行去食" };
      }
    }
    local = unseenStepFrom(mx, my, facing);
    if (local) {
      why = roomy ? "大房探索未知，唔貼牆" : "沿走廊踏入未知格";
      return { x: local.x, y: local.y, dir: local.dir, why: why };
    }
    fs = frontierTiles();
    targets = fs.filter(function (p) { return !memory.visited[key(p.x, p.y)]; });
    if (!targets.length) targets = fs;
    best = null;
    for (i = 0; i < targets.length; i++) {
      t = targets[i];
      path = bfsKnown(mx, my, function (x, y) { return x === t.x && y === t.y; });
      if (!path) continue;
      if (path.length === 1) {
        nbs = knownNeighbors(mx, my);
        for (n = 0; n < nbs.length; n++) {
          if (memory.seen[key(nbs[n].x, nbs[n].y)]) continue;
          if (isVisibleDeadEnd(mx, my, nbs[n].x, nbs[n].y)) continue;
          if (isWastefulWallApproach(mx, my, nbs[n])) continue;
          return { x: nbs[n].x, y: nbs[n].y, dir: nbs[n].dir, why: "避開死巷／牆身，踏入未知" };
        }
        continue;
      }
      first = path[1];
      if (isVisibleDeadEnd(mx, my, first.x, first.y)) continue;
      sc = stepScore(first.dir, facing, path.cost || path.length, !!memory.visited[key(t.x, t.y)], mx, my, first.x, first.y);
      if (isWastefulWallApproach(mx, my, first)) sc += 500;
      if (!best || sc < best.sc) best = { sc: sc, move: first, hug: isWastefulWallApproach(mx, my, first) };
    }
    if (best) {
      if (best.hug) why = "大房見牆但要繞路";
      else if (roomy) why = "大房沿空地探索";
      else why = "沿走廊探索未知";
      return { x: best.move.x, y: best.move.y, dir: best.move.dir, why: why };
    }
    nbs = knownNeighbors(mx, my);
    var skippedDead = false;
    var skippedWall = false;
    nbs.sort(function (a, b) {
      var ca = wallClearance(a.x, a.y), cb = wallClearance(b.x, b.y);
      if (roomy && ca !== cb) return cb - ca;
      var av = memory.visited[key(a.x, a.y)] ? 1 : 0;
      var bv = memory.visited[key(b.x, b.y)] ? 1 : 0;
      if (av !== bv) return av - bv;
      if (a.dir === facing) return -1;
      if (b.dir === facing) return 1;
      return 0;
    });
    for (i = 0; i < nbs.length; i++) {
      n = nbs[i];
      if (isVisibleDeadEnd(mx, my, n.x, n.y)) {
        skippedDead = true;
        continue;
      }
      if (isWastefulWallApproach(mx, my, n)) {
        skippedWall = true;
        continue;
      }
      if (skippedDead) why = "見到死巷，掉頭";
      else if (skippedWall) why = "大房見到牆，掉頭行空地";
      else if (roomy && wallClearance(n.x, n.y) > wallClearance(mx, my)) why = "離開牆邊";
      else why = roomy ? "大房沿空地走" : "沿走廊前進";
      return { x: n.x, y: n.y, dir: n.dir, why: why };
    }
    if (nbs.length) {
      n = nbs[0];
      return { x: n.x, y: n.y, dir: n.dir, why: skippedWall ? "大房見牆但無其他路" : "唯一出路" };
    }
    return { stuck: true, why: "卡住，已知範圍冇路可走" };
  }

  function seenCount() { return Object.keys(memory.seen).length; }
  function visCount() { return Object.keys(memory.visible).length; }

  function knowledgeLine() {
    var bits = [];
    bits.push("視力範圍 " + VISION + " 格");
    bits.push("而家睇到 " + visCount() + " 格");
    bits.push("記憶 " + seenCount() + " 格");
    bits.push(memory.exit ? "已知 EXIT (" + memory.exit.x + "," + memory.exit.y + ")" : "未見過 EXIT");
    bits.push(Object.keys(memory.cakes).length ? "已知蛋糕" : "未見過蛋糕");
    if (liveMouse) bits.push(inRoom(liveMouse.x, liveMouse.y) ? "判斷：大房" : "判斷：走廊");
    return bits.join("｜");
  }

  function writeLog() {
    var lines = [];
    lines.push("AI 唔知地圖設計。360° 視力係視線（牆擋住就睇唔到轉角後），距離 " + VISION + " 格。可斜行，斜行同直行一步等權；穿過格角時四條相連牆任一存在都擋。大房見到牆就唔行埋；走廊先會貼牆。");
    lines.push(knowledgeLine());
    if (!trail.length) {
      logEl.textContent = lines.join("\n");
      return;
    }
    lines.push("行走路線（座標／面向／原因）：");
    trail.forEach(function (p, i) {
      lines.push(
        (i === trail.length - 1 ? "● " : "○ ") +
        String(i).padStart(3, " ") +
        "  (" + p.x + "," + p.y + ")  " +
        DIR_ARROW[p.dir] + " " + DIR_NAME[p.dir] +
        (p.why ? "  " + p.why : "") +
        (p.eat ? "  食蛋糕" : "") +
        (p.exit ? "  EXIT" : "")
      );
    });
    logEl.textContent = lines.join("\n");
    logEl.scrollTop = logEl.scrollHeight;
  }

  function finish(ok, msg) {
    stopTimer();
    mode = ok ? "done" : "failed";
    setStatus(msg);
    updateButtons();
    writeLog();
    draw();
  }

  function maxSteps() {
    return Math.max(80, columns * rows * 6);
  }

  function stepOnce() {
    if (mode === "done" || mode === "failed") return;
    if (!liveMouse) return;
    if (mode === "idle") mode = "paused";
    sense();
    var k = key(liveMouse.x, liveMouse.y);
    memory.visited[k] = true;
    if (world.cakes[k] && !eaten[k]) {
      eaten[k] = true;
      delete memory.cakes[k];
      trail[trail.length - 1].eat = true;
      trail[trail.length - 1].why = "食咗蛋糕，繼續探索 EXIT";
      setStatus("食咗蛋糕，繼續探索");
      writeLog();
      draw();
      return;
    }
    if (world.exit && liveMouse.x === world.exit.x && liveMouse.y === world.exit.y) {
      trail[trail.length - 1].exit = true;
      finish(true, "已到達 EXIT，共 " + (trail.length - 1) + " 步" + (Object.keys(eaten).length ? "，途中食過蛋糕" : "（冇見過／冇食蛋糕）"));
      return;
    }
    if (trail.length - 1 >= maxSteps()) {
      finish(false, "步數過多，停止探索");
      return;
    }
    var choice = decide();
    lastWhy = choice.why || "";
    if (choice.done === "exit") {
      trail[trail.length - 1].exit = true;
      finish(true, "已到達 EXIT，共 " + (trail.length - 1) + " 步");
      return;
    }
    if (choice.eat) {
      eaten[k] = true;
      delete memory.cakes[k];
      trail[trail.length - 1].eat = true;
      setStatus("食咗蛋糕，繼續探索");
      writeLog();
      draw();
      return;
    }
    if (choice.stuck) {
      finish(false, choice.why);
      return;
    }
    if (trueBlocked(liveMouse.x, liveMouse.y, choice.x, choice.y)) {
      finish(false, "AI 試圖行入牆，已停止（視力／記憶邏輯錯誤）");
      return;
    }
    liveMouse.x = choice.x;
    liveMouse.y = choice.y;
    liveMouse.direction = choice.dir;
    trail.push({ x: choice.x, y: choice.y, dir: choice.dir, why: choice.why });
    sense();
    memory.visited[key(liveMouse.x, liveMouse.y)] = true;
    setStatus("第 " + (trail.length - 1) + " 步　" + choice.why + "　" + knowledgeLine());
    writeLog();
    draw();
    if (world.exit && liveMouse.x === world.exit.x && liveMouse.y === world.exit.y) {
      trail[trail.length - 1].exit = true;
      finish(true, "已到達 EXIT，共 " + (trail.length - 1) + " 步" + (Object.keys(eaten).length ? "，途中食過蛋糕" : "（冇見過／冇食蛋糕）"));
    }
  }

  function stopTimer() {
    if (timer) {
      clearInterval(timer);
      timer = 0;
    }
  }

  function speedMs() {
    return 760 - Number(inpSpeed.value);
  }

  function startRun() {
    if (mode === "done" || mode === "failed" || mode === "running") {
      resetLive(false);
    }
    if (!liveMouse) return;
    mode = "running";
    updateButtons();
    stopTimer();
    timer = setInterval(stepOnce, speedMs());
    setStatus("探索中… 視力 " + VISION + " 格，唔知全圖");
  }

  function pauseRun() {
    if (mode !== "running") return;
    stopTimer();
    mode = "paused";
    setStatus("已暫停，第 " + Math.max(0, trail.length - 1) + " 步　" + knowledgeLine());
    updateButtons();
  }

  function updateButtons() {
    var can = !!(world.mouse && world.exit);
    btnRun.disabled = !can;
    btnStep.disabled = !can || mode === "done" || mode === "failed";
    btnPause.disabled = mode !== "running";
    btnPause.classList.toggle("active", mode === "paused");
    btnRun.classList.toggle("active", mode === "running");
  }

  function wallWidth() { return Math.max(5, tileSize * 0.18); }

  function drawWallSeg(g, ori, x, y, color, width) {
    var ts = tileSize, x1, y1, x2, y2;
    if (ori === "H") {
      x1 = x * ts; y1 = y * ts; x2 = (x + 1) * ts; y2 = y1;
    } else {
      x1 = x * ts; y1 = y * ts; x2 = x1; y2 = (y + 1) * ts;
    }
    g.strokeStyle = color;
    g.lineWidth = width || wallWidth();
    g.lineCap = "butt";
    g.beginPath();
    g.moveTo(x1, y1);
    g.lineTo(x2, y2);
    g.stroke();
  }

  function drawArrow(g, cx, cy, dir, ts) {
    var v = DIR_VEC[dir] || DIR_VEC.N;
    var mag = Math.hypot(v[0], v[1]) || 1;
    v = [v[0] / mag, v[1] / mag];
    var len = ts * 0.28;
    var ax = cx + v[0] * len, ay = cy + v[1] * len;
    var bx = cx + v[0] * ts * 0.04, by = cy + v[1] * ts * 0.04;
    g.strokeStyle = "#111";
    g.fillStyle = "#FF3B30";
    g.lineWidth = Math.max(2, ts * 0.06);
    g.lineCap = "round";
    g.beginPath();
    g.moveTo(bx, by);
    g.lineTo(ax, ay);
    g.stroke();
    var px = -v[1], py = v[0], hs = ts * 0.1;
    g.beginPath();
    g.moveTo(ax + v[0] * hs * 0.4, ay + v[1] * hs * 0.4);
    g.lineTo(ax - px * hs - v[0] * hs * 0.2, ay - py * hs - v[1] * hs * 0.2);
    g.lineTo(ax + px * hs - v[0] * hs * 0.2, ay + py * hs - v[1] * hs * 0.2);
    g.closePath();
    g.fill();
  }

  function fillTile(g, x, y, color) {
    g.fillStyle = color;
    g.fillRect(x * tileSize, y * tileSize, tileSize, tileSize);
  }

  function drawKnownWalls(g) {
    Object.keys(memory.edge).forEach(function (ek) {
      if (memory.edge[ek] !== "wall") return;
      var parts = ek.split(":");
      var ori = parts[0];
      var xy = parts[1].split(",");
      drawWallSeg(g, ori, Number(xy[0]), Number(xy[1]), WALL, wallWidth());
    });
  }

  function drawTrail(g, showAll) {
    if (trail.length < 1) return;
    var ts = tileSize, i, p;
    g.lineJoin = "round";
    g.lineCap = "round";
    if (trail.length > 1) {
      g.beginPath();
      for (i = 0; i < trail.length; i++) {
        p = trail[i];
        if (i === 0) g.moveTo((p.x + 0.5) * ts, (p.y + 0.5) * ts);
        else g.lineTo((p.x + 0.5) * ts, (p.y + 0.5) * ts);
      }
      g.strokeStyle = "#1B5E20";
      g.lineWidth = Math.max(4, ts * 0.16);
      g.globalAlpha = 0.85;
      g.stroke();
      g.globalAlpha = 1;
    }
    if (chkNums.checked) {
      g.font = "bold " + Math.max(9, ts * 0.26) + "px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      for (i = 0; i < trail.length; i++) {
        p = trail[i];
        if (!showAll && !memory.seen[key(p.x, p.y)]) continue;
        g.fillStyle = "#E8F5E9";
        g.strokeStyle = "#111";
        g.lineWidth = 3;
        g.strokeText(String(i), (p.x + 0.78) * ts, (p.y + 0.22) * ts);
        g.fillText(String(i), (p.x + 0.78) * ts, (p.y + 0.22) * ts);
      }
    }
  }

  function drawKnownItems(g) {
    var ts = tileSize, k, it, x, y, cx, cy, pad, vis;
    if (memory.exit) {
      x = memory.exit.x; y = memory.exit.y;
      vis = !!memory.visible[key(x, y)];
      cx = (x + 0.5) * ts; cy = (y + 0.5) * ts;
      pad = ts * 0.12;
      g.globalAlpha = vis ? 1 : 0.55;
      g.fillStyle = EXIT_BG;
      g.fillRect(x * ts + pad, y * ts + pad * 1.3, ts - pad * 2, ts - pad * 2.6);
      g.strokeStyle = "#7A5A00";
      g.strokeRect(x * ts + pad, y * ts + pad * 1.3, ts - pad * 2, ts - pad * 2.6);
      g.fillStyle = "#1A1A1A";
      g.font = "bold " + Math.max(9, ts * 0.28) + "px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("EXIT", cx, cy);
      g.globalAlpha = 1;
    }
    Object.keys(memory.cakes).forEach(function (ck) {
      it = memory.cakes[ck];
      if (eaten[ck]) return;
      vis = !!memory.visible[ck];
      g.globalAlpha = vis ? 1 : 0.55;
      g.font = Math.max(14, ts * 0.62) + "px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("🍰", (it.x + 0.5) * ts, (it.y + 0.5) * ts);
      g.globalAlpha = 1;
    });
  }

  function drawWorldWalls(g) {
    Object.keys(world.wallH).forEach(function (k) {
      var xy = k.split(",");
      drawWallSeg(g, "H", Number(xy[0]), Number(xy[1]), WALL, wallWidth());
    });
    Object.keys(world.wallV).forEach(function (k) {
      var xy = k.split(",");
      drawWallSeg(g, "V", Number(xy[0]), Number(xy[1]), WALL, wallWidth());
    });
  }

  function drawWorldItems(g) {
    var ts = tileSize, pad, cx, cy, k, cake;
    if (world.exit) {
      pad = ts * 0.12;
      cx = (world.exit.x + 0.5) * ts;
      cy = (world.exit.y + 0.5) * ts;
      g.fillStyle = EXIT_BG;
      g.fillRect(world.exit.x * ts + pad, world.exit.y * ts + pad * 1.3, ts - pad * 2, ts - pad * 2.6);
      g.strokeStyle = "#7A5A00";
      g.strokeRect(world.exit.x * ts + pad, world.exit.y * ts + pad * 1.3, ts - pad * 2, ts - pad * 2.6);
      g.fillStyle = "#1A1A1A";
      g.font = "bold " + Math.max(9, ts * 0.28) + "px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("EXIT", cx, cy);
    }
    Object.keys(world.cakes).forEach(function (ck) {
      if (eaten[ck]) return;
      cake = world.cakes[ck];
      g.font = Math.max(14, ts * 0.62) + "px sans-serif";
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.fillText("🍰", (cake.x + 0.5) * ts, (cake.y + 0.5) * ts);
    });
  }

  function drawMouse(g) {
    if (!liveMouse) return;
    var ts = tileSize;
    var cx = (liveMouse.x + 0.5) * ts;
    var cy = (liveMouse.y + 0.5) * ts;
    g.strokeStyle = "#FF3B30";
    g.lineWidth = Math.max(2, ts * 0.07);
    g.strokeRect(liveMouse.x * ts + 2, liveMouse.y * ts + 2, ts - 4, ts - 4);
    g.font = Math.max(14, ts * 0.58) + "px sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.fillText("🐭", cx, cy - ts * 0.04);
    drawArrow(g, cx, cy, liveMouse.direction, ts);
  }

  function drawFog(g) {
    var x, y, k, ts = tileSize;
    for (y = 0; y < rows; y++) {
      for (x = 0; x < columns; x++) {
        k = key(x, y);
        if (memory.visible[k]) {
          if (chkSearch.checked) fillTile(g, x, y, "rgba(255,245,200,0.18)");
        } else if (memory.seen[k]) {
          fillTile(g, x, y, "rgba(20,16,10,0.42)");
        } else {
          g.fillStyle = "#121212";
          g.fillRect(x * ts, y * ts, ts, ts);
        }
      }
    }
  }

  function drawGround(g) {
    var ts = tileSize, mw = columns * ts, mh = rows * ts, i;
    g.fillStyle = SAND;
    g.fillRect(0, 0, mw, mh);
    g.strokeStyle = GRID;
    g.lineWidth = Math.max(1, 1 / zoom);
    g.beginPath();
    for (i = 0; i <= columns; i++) {
      g.moveTo(i * ts + 0.5, 0);
      g.lineTo(i * ts + 0.5, mh);
    }
    for (i = 0; i <= rows; i++) {
      g.moveTo(0, i * ts + 0.5);
      g.lineTo(mw, i * ts + 0.5);
    }
    g.stroke();
  }

  function drawTrailTiles(g, onlySeen) {
    var x, y, k;
    for (y = 0; y < rows; y++) {
      for (x = 0; x < columns; x++) {
        k = key(x, y);
        if (onlySeen && !memory.seen[k]) continue;
        if (trail.some(function (p) { return p.x === x && p.y === y; })) {
          fillTile(g, x, y, "rgba(27,94,32,0.22)");
        }
      }
    }
  }

  function drawMapMouse(g) {
    drawGround(g);
    drawTrailTiles(g, true);
    drawTrail(g, false);
    drawKnownWalls(g);
    drawKnownItems(g);
    drawFog(g);
    drawKnownWalls(g);
    drawKnownItems(g);
    drawMouse(g);
  }

  function drawVisionOutline(g) {
    if (!memory) return;
    var ts = tileSize;
    var keys = Object.keys(memory.visible);
    if (!keys.length) return;
    keys.forEach(function (vk) {
      var xy = vk.split(",");
      fillTile(g, Number(xy[0]), Number(xy[1]), "rgba(255,255,255,0.16)");
    });
    g.strokeStyle = "#FFFFFF";
    g.lineWidth = Math.max(3, ts * 0.1);
    g.lineJoin = "miter";
    g.lineCap = "butt";
    var inset = g.lineWidth / 2 + 0.5;
    g.beginPath();
    keys.forEach(function (vk) {
      var xy = vk.split(",");
      var x = Number(xy[0]), y = Number(xy[1]);
      var px = x * ts, py = y * ts;
      if (!memory.visible[key(x, y - 1)]) {
        g.moveTo(px + inset, py + inset);
        g.lineTo(px + ts - inset, py + inset);
      }
      if (!memory.visible[key(x + 1, y)]) {
        g.moveTo(px + ts - inset, py + inset);
        g.lineTo(px + ts - inset, py + ts - inset);
      }
      if (!memory.visible[key(x, y + 1)]) {
        g.moveTo(px + inset, py + ts - inset);
        g.lineTo(px + ts - inset, py + ts - inset);
      }
      if (!memory.visible[key(x - 1, y)]) {
        g.moveTo(px + inset, py + inset);
        g.lineTo(px + inset, py + ts - inset);
      }
    });
    g.stroke();
  }

  function drawMapDev(g) {
    drawGround(g);
    drawTrailTiles(g, false);
    drawTrail(g, true);
    drawWorldWalls(g);
    drawWorldItems(g);
    drawVisionOutline(g);
    drawMouse(g);
  }

  function paintView(viewCanvas, g, w, h, god) {
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.fillStyle = "#0e0e0e";
    g.fillRect(0, 0, w, h);
    g.save();
    g.translate(panX, panY);
    g.scale(zoom, zoom);
    if (god) drawMapDev(g);
    else if (memory) drawMapMouse(g);
    g.restore();
  }

  function draw() {
    paintView(canvas, ctx, cssW, cssH, false);
    paintView(canvasDev, ctxDev, cssW, cssH, true);
  }

  function screenToWorld(sx, sy) {
    return { x: (sx - panX) / zoom, y: (sy - panY) / zoom };
  }

  function zoomAt(sx, sy, factor) {
    var w = screenToWorld(sx, sy);
    zoom = clamp(zoom * factor, 0.05, 8);
    panX = sx - w.x * zoom;
    panY = sy - w.y * zoom;
    draw();
  }

  function fitScreen() {
    var pad = 18;
    var bw = Math.max(1, columns * tileSize);
    var bh = Math.max(1, rows * tileSize);
    zoom = clamp(Math.min((cssW - pad * 2) / bw, (cssH - pad * 2) / bh), 0.05, 8);
    panX = (cssW - bw * zoom) / 2;
    panY = (cssH - bh * zoom) / 2;
    draw();
  }

  function resizeCanvas() {
    var mouseBox = canvas.parentNode.getBoundingClientRect();
    var devBox = canvasDev.parentNode.getBoundingClientRect();
    cssW = Math.max(1, Math.min(mouseBox.width, devBox.width));
    cssH = Math.max(1, Math.min(mouseBox.height, devBox.height));
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvasDev.width = Math.round(cssW * dpr);
    canvasDev.height = Math.round(cssH * dpr);
    draw();
  }

  function canvasPos(e) {
    var target = e.currentTarget || canvas;
    var r = target.getBoundingClientRect();
    var sx = (e.clientX - r.left) * (cssW / Math.max(1, r.width));
    var sy = (e.clientY - r.top) * (cssH / Math.max(1, r.height));
    return { x: sx, y: sy };
  }

  function bindCanvas(el) {
    el.addEventListener("wheel", function (e) {
      e.preventDefault();
      zoomAt(canvasPos(e).x, canvasPos(e).y, e.deltaY < 0 ? 1.12 : 1 / 1.12);
    }, { passive: false });
    el.addEventListener("pointerdown", function (e) {
      el.setPointerCapture(e.pointerId);
      var p = canvasPos(e);
      dragging = { x: p.x, y: p.y, panX: panX, panY: panY };
    });
    el.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      var p = canvasPos(e);
      panX = dragging.panX + (p.x - dragging.x);
      panY = dragging.panY + (p.y - dragging.y);
      draw();
    });
    el.addEventListener("pointerup", function () { dragging = null; });
    el.addEventListener("pointercancel", function () { dragging = null; });
    el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  }

  function bind() {
    document.getElementById("btn-run").onclick = startRun;
    document.getElementById("btn-pause").onclick = pauseRun;
    document.getElementById("btn-step").onclick = function () {
      if (mode === "running") pauseRun();
      stepOnce();
      updateButtons();
    };
    document.getElementById("btn-reset").onclick = function () { resetLive(true); };
    document.getElementById("btn-fit").onclick = fitScreen;
    document.getElementById("btn-zoom-in").onclick = function () { zoomAt(cssW / 2, cssH / 2, 1.2); };
    document.getElementById("btn-zoom-out").onclick = function () { zoomAt(cssW / 2, cssH / 2, 1 / 1.2); };
    document.getElementById("btn-load").onclick = function () { fileInput.click(); };
    chkSearch.onchange = draw;
    chkNums.onchange = draw;
    selVision.onchange = function () {
      applyVisionRange(selVision.value);
    };
    inpSpeed.oninput = function () {
      if (mode === "running") {
        stopTimer();
        timer = setInterval(stepOnce, speedMs());
      }
    };
    fileInput.onchange = function () {
      var f = fileInput.files && fileInput.files[0];
      fileInput.value = "";
      loadMapFile(f);
    };
    var dragDepth = 0;
    function isJsonDrag(e) {
      var types = e.dataTransfer && e.dataTransfer.types;
      if (!types) return false;
      return Array.prototype.indexOf.call(types, "Files") >= 0;
    }
    appEl.addEventListener("dragenter", function (e) {
      if (!isJsonDrag(e)) return;
      e.preventDefault();
      dragDepth += 1;
      appEl.classList.add("dragover");
    });
    appEl.addEventListener("dragover", function (e) {
      if (!isJsonDrag(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = "copy";
    });
    appEl.addEventListener("dragleave", function (e) {
      if (!isJsonDrag(e)) return;
      dragDepth = Math.max(0, dragDepth - 1);
      if (!dragDepth) appEl.classList.remove("dragover");
    });
    appEl.addEventListener("drop", function (e) {
      e.preventDefault();
      dragDepth = 0;
      appEl.classList.remove("dragover");
      var files = e.dataTransfer && e.dataTransfer.files;
      if (!files || !files.length) return;
      loadMapFile(files[0]);
    });
    bindCanvas(canvas);
    bindCanvas(canvasDev);
    window.addEventListener("resize", function () { resizeCanvas(); });
    window.addEventListener("keydown", function (e) {
      if (e.key === " ") { e.preventDefault(); if (mode === "running") pauseRun(); else startRun(); }
      if (e.key === "r" || e.key === "R") { e.preventDefault(); resetLive(true); }
      if (e.key === "n" || e.key === "N") { e.preventDefault(); btnStep.click(); }
    });
  }

  bind();
  resizeCanvas();
  var boot = parseMap(DEFAULT_MAP);
  if (boot.error) setStatus(boot.error);
  else applyParsed(boot, "已載入預設地圖（GPT-5.6 Sol）");
  window.addEventListener("load", function () { resizeCanvas(); fitScreen(); });
})();

</script>
</body>
</html>
